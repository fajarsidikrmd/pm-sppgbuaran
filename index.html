<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SPPGBuaran - Portal Data Penerima Manfaat</title>
  
  <link rel="manifest" href="/pm-sppgbuaran/manifest.json">
  <link rel="apple-touch-icon" href="/pm-sppgbuaran/icon-512-v2.png">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #F4F6F8;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>

  <!-- PUSTAKA ONESIGNAL RESMI PADA DOMAIN INDUK (GITHUB PAGES) -->
  <!-- SDK OneSignal di Halaman Induk GitHub Pages -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "45e3fd0d-04ff-4415-a898-b47b301ee157",
        serviceWorkerParam: { scope: "/pm-sppgbuaran/" },
        serviceWorkerPath: "/pm-sppgbuaran/sw.js",
        notifyButton: { enable: false },
        allowLocalhostAsSecureOrigin: true
      });

      // Fungsi pasang tag role=admin otomatis
      async function applyAdminTag() {
        try {
          if (OneSignal.User) {
            await OneSignal.User.addTag("role", "admin");
            console.log("[OneSignal] Tag role=admin berhasil dipasang otomatis.");
          }
        } catch (e) {
          console.error("[OneSignal] Gagal memasang tag:", e);
        }
      }

      // Pasang tag jika langganan sudah aktif
      if (OneSignal.User && OneSignal.User.PushSubscription && OneSignal.User.PushSubscription.optedIn) {
        await applyAdminTag();
      }

      // Pantau jika status izin berubah menjadi aktif
      if (OneSignal.User && OneSignal.User.PushSubscription) {
        OneSignal.User.PushSubscription.addEventListener("change", async function(event) {
          if (event.current.optedIn) {
            await applyAdminTag();
          }
        });
      }
    });

    // Menangkap sinyal tombol profil
    window.addEventListener("message", async function(event) {
      if (event.data && event.data.action === "ACTIVATE_ADMIN_PUSH") {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            if (Notification.permission !== "granted") {
              await OneSignal.Notifications.requestPermission();
            }
            if (OneSignal.User && OneSignal.User.PushSubscription) {
              await OneSignal.User.PushSubscription.optIn();
            }
            await OneSignal.User.addTag("role", "admin");

            const iframe = document.getElementById("gasIframe");
            if (iframe && iframe.contentWindow) {
              iframe.contentWindow.postMessage({ action: "ADMIN_PUSH_SUCCESS" }, "*");
            }
          } catch (err) {
            console.error("Error aktivasi OneSignal:", err);
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- Iframe Google Apps Script dengan atribut ID gasIframe -->
  <iframe 
    id="gasIframe"
    src="https://script.google.com/macros/s/AKfycbzyvqiKvx51DhSNcnUHxR1l4YEjdVy1ONu6m86W-5Dv_VtidRf5Hg2PFUxUxHwUqeJkJw/exec" 
    allow="geolocation; camera">
  </iframe>

</body>
</html>
