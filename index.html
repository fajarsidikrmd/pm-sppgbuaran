<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Portal Data Penerima Manfaat</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-512-v2.png">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* SPLASH SCREEN LANGSUNG DARI HTML PEMBUNGKUS */
    #wrapperSplashScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      user-select: none;
    }
    #wrapperSplashScreen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-monogram {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
    }
    .bar-primary {
      width: 14px;
      height: 24px;
      background-color: #0E1015;
      border-radius: 3.5px;
      transform: skewX(-12deg);
    }
    .bar-secondary {
      width: 9px;
      height: 18px;
      background-color: rgba(14, 16, 21, 0.35);
      border-radius: 2.5px;
      transform: skewX(-12deg);
      margin-top: -3px;
    }
    .splash-title {
      font-size: 20px;
      font-weight: 700;
      color: #0E1015;
      letter-spacing: -0.03em;
    }
    .splash-sub {
      font-size: 12px;
      color: #5C6270;
      margin-top: 3px;
    }
    .splash-progress-track {
      width: 160px;
      height: 3px;
      background-color: #F1F3F5;
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 24px;
      position: relative;
    }
    .splash-progress-bar {
      height: 100%;
      background-color: #0E1015;
      border-radius: 9999px;
      width: 40%;
      animation: indeterminateProgress 1.4s infinite ease-in-out;
    }
    .splash-status-text {
      font-size: 10px;
      font-family: monospace;
      color: #8D94A5;
      margin-top: 10px;
      letter-spacing: -0.02em;
    }
    @keyframes indeterminateProgress {
      0% { transform: translateX(-100%); width: 25%; }
      50% { width: 55%; }
      100% { transform: translateX(250%); width: 25%; }
    }
  </style>

  <!-- ONESIGNAL SDK GITHUB PAGES -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "45e3fd0d-04ff-4415-a898-b47b301ee157",
        path: "/pm-sppgbuaran/",
        serviceWorkerPath: "OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/pm-sppgbuaran/" },
        allowLocalhostAsSecureOrigin: true
      });
      if (OneSignal.User && OneSignal.User.PushSubscription && OneSignal.User.PushSubscription.optedIn) {
        await OneSignal.User.addTag("role", "admin");
      }
    });

    window.addEventListener("message", async function(event) {
      if (!event.data) return;
      if (event.data.action === "ACTIVATE_ADMIN_PUSH") {
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            if (Notification.permission !== "granted") await OneSignal.Notifications.requestPermission();
            if (OneSignal.User && OneSignal.User.PushSubscription) await OneSignal.User.PushSubscription.optIn();
            await OneSignal.User.addTag("role", "admin");
          } catch (e) {}
        });
      }
      if (event.data.action === "SYNC_USER_TAGS") {
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            if (event.data.email) await OneSignal.login(event.data.email);
            if (event.data.tags) await OneSignal.User.addTags(event.data.tags);
          } catch (e) {}
        });
      }
      if (event.data.action === "CLEAR_USER_TAGS") {
        OneSignalDeferred.push(async function(OneSignal) {
          try { await OneSignal.logout(); } catch (e) {}
        });
      }
    });
  </script>
</head>
<body>

  <!-- LAYER SPLASH SCREEN LANGSUNG TAMPIL SEJAK MILIDETIK PERTAMA -->
  <div id="wrapperSplashScreen">
    <div class="splash-monogram">
      <span class="bar-primary"></span>
      <span class="bar-secondary"></span>
    </div>
    <div class="splash-title">sppgbuaran<span style="color:#9CA3AF;font-weight:400;">.</span></div>
    <div class="splash-sub">Portal data penerima manfaat</div>

    <div class="splash-progress-track">
      <div class="splash-progress-bar"></div>
    </div>
    <span class="splash-status-text">Menyiapkan ruang kerja...</span>
  </div>

  <iframe 
    id="gasIframe"
    src="https://script.google.com/macros/s/AKfycbzyvqiKvx51DhSNcnUHxR1l4YEjdVy1ONu6m86W-5Dv_VtidRf5Hg2PFUxUxHwUqeJkJw/exec" 
    allow="geolocation; camera">
  </iframe>

  <script>
    const iframe = document.getElementById('gasIframe');
    const splash = document.getElementById('wrapperSplashScreen');

    function dismissSplash() {
      if (!splash.classList.contains('fade-out')) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 450);
      }
    }

    // Hilangkan splash screen seketika saat iframe Google Apps Script selesai dimuat
    iframe.addEventListener('load', function() {
      setTimeout(dismissSplash, 300);
    });

    // Batas pengaman jika jaringan lambat
    setTimeout(dismissSplash, 7000);
  </script>
</body>
</html>
