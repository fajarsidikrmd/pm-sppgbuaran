<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SPPGBuaran - Portal Data Penerima Manfaat</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-512-v2.png">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #F4F6F8;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>

  <!-- ONESIGNAL SDK GITHUB PAGES -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "45e3fd0d-04ff-4415-a898-b47b301ee157",
        path: "/pm-sppgbuaran/",
        serviceWorkerPath: "OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/pm-sppgbuaran/" },
        allowLocalhostAsSecureOrigin: true
      });

      // Otomatis pasang tag admin jika izin notifikasi peramban sudah aktif
      if (OneSignal.User && OneSignal.User.PushSubscription && OneSignal.User.PushSubscription.optedIn) {
        await OneSignal.User.addTag("role", "admin");
        console.log("[OneSignal] Default tag role=admin otomatis terpasang.");
      }
    });

    // Menangkap sinyal langsung dari iframe Google Apps Script via window.top
    window.addEventListener("message", async function(event) {
      if (!event.data) return;

      // 1. Aktivasi tombol profil admin
      if (event.data.action === "ACTIVATE_ADMIN_PUSH") {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            if (Notification.permission !== "granted") {
              await OneSignal.Notifications.requestPermission();
            }
            if (OneSignal.User && OneSignal.User.PushSubscription) {
              await OneSignal.User.PushSubscription.optIn();
            }
            await OneSignal.User.addTag("role", "admin");
            console.log("[OneSignal] Tombol profil: Tag role=admin berhasil dipasang!");
          } catch (e) {
            console.error("[OneSignal Error]:", e);
          }
        });
      }

      // 2. Sinkronisasi multi-tag saat login
      if (event.data.action === "SYNC_USER_TAGS") {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            if (event.data.email) {
              await OneSignal.login(event.data.email);
            }
            if (event.data.tags) {
              await OneSignal.User.addTags(event.data.tags);
            }
            console.log("[OneSignal] Multi-tag berhasil disinkronkan:", event.data.tags);
          } catch (e) {
            console.error("[OneSignal Error Sync]:", e);
          }
        });
      }

      // 3. Pembersihan tag saat logout
      if (event.data.action === "CLEAR_USER_TAGS") {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.logout();
            console.log("[OneSignal] Tag akun dibersihkan.");
          } catch (e) {
            console.error("[OneSignal Error Logout]:", e);
          }
        });
      }
    });
  </script>
</head>
<body>
  <iframe 
    id="gasIframe"
    src="https://script.google.com/macros/s/AKfycbzyvqiKvx51DhSNcnUHxR1l4YEjdVy1ONu6m86W-5Dv_VtidRf5Hg2PFUxUxHwUqeJkJw/exec" 
    allow="geolocation; camera">
  </iframe>
</body>
</html>
